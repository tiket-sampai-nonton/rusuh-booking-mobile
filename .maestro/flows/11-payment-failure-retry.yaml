appId: com.tiketsampainonton.rusuhbooking
name: 11-payment-failure-retry
tags:
  - regression
---
- runFlow: ../helpers/start.yaml
- runFlow: ../helpers/checkout.yaml
- runFlow: ../helpers/pay.yaml
- scrollUntilVisible:
    element:
      id: snap-fail
    direction: DOWN
    timeout: 20000
- tapOn:
    id: snap-fail
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: expired-retry
    timeout: 30000
- tapOn:
    id: expired-retry
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: method-VA_BCA
    timeout: 30000
- scrollUntilVisible:
    element:
      id: method-QRIS
    direction: DOWN
    timeout: 20000
- tapOn:
    id: method-QRIS
    waitToSettleTimeoutMs: 200
- tapOn:
    id: pay-now
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: snap-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: snap-success
    direction: DOWN
    timeout: 20000
- tapOn:
    id: snap-success
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: success-eyebrow
    timeout: 30000
- scrollUntilVisible:
    element:
      id: eticket-0
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: eticket-0
