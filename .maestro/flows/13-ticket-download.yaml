appId: com.tiketsampainonton.rusuhbooking
name: 13-ticket-download
tags:
  - regression
  - native-share
---
- runFlow: ../helpers/start.yaml
- runFlow: ../helpers/checkout.yaml
- runFlow: ../helpers/pay.yaml
- scrollUntilVisible:
    element:
      id: snap-success
    direction: DOWN
    timeout: 20000
- tapOn:
    id: snap-success
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: success-eyebrow
    timeout: 30000
- scrollUntilVisible:
    element:
      id: eticket-0
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: eticket-0
- scrollUntilVisible:
    element:
      id: success-download
    direction: DOWN
    timeout: 20000
- tapOn:
    id: success-download
    waitToSettleTimeoutMs: 200
