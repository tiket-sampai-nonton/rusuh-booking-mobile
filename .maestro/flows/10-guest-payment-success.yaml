appId: com.tiketsampainonton.rusuhbooking
name: 10-guest-payment-success
tags:
  - regression
  - smoke
---
- runFlow: ../helpers/start.yaml
- runFlow: ../helpers/checkout.yaml
- runFlow: ../helpers/pay.yaml
- scrollUntilVisible:
    element:
      id: snap-success
    direction: DOWN
    timeout: 20000
- tapOn:
    id: snap-success
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: success-eyebrow
    timeout: 30000
- scrollUntilVisible:
    element:
      id: eticket-0
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: eticket-0
- scrollUntilVisible:
    element:
      id: success-home
    direction: DOWN
    timeout: 20000
- tapOn:
    id: success-home
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: home-scroll
    timeout: 30000
