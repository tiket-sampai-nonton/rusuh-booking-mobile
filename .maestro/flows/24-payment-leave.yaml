appId: com.tiketsampainonton.rusuhbooking
name: 24-payment-leave
tags:
  - regression
---
- runFlow: ../helpers/start.yaml
- runFlow: ../helpers/checkout.yaml
- runFlow: ../helpers/hold.yaml
- tapOn:
    id: payment-back
    waitToSettleTimeoutMs: 200
- assertVisible:
    id: checkout-leave-modal
- tapOn:
    id: checkout-stay
    waitToSettleTimeoutMs: 200
- assertVisible:
    id: payment-timer
- tapOn:
    id: payment-back
    waitToSettleTimeoutMs: 200
- tapOn:
    id: checkout-leave-confirm
    waitToSettleTimeoutMs: 200
- extendedWaitUntil:
    visible:
      id: home-scroll
    timeout: 30000
