<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sesi Berakhir — Rusuh Tiket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css">
<style>
/*
  ═══════════════════════════════════════════════════════════════════════════════
  RUSUH TIKET — Mobile Expired/Failed Screen
  V2 Brutalist Mono Theme — Mobile App Optimized
  ═══════════════════════════════════════════════════════════════════════════════
*/

body {
  background: var(--ink);
  color: var(--ground);
}

.app {
  min-height: 100vh;
  min-height: 100dvh;
  padding: var(--safe-top) var(--frame) calc(var(--space-l) + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* ═══════════════════════════════════════
   EXPIRED STATE
   ═══════════════════════════════════════ */
.expired-icon {
  width: 100px;
  height: 100px;
  margin-bottom: var(--space-l);
  border: 3px solid var(--ground);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: shake 0.6s var(--ease);
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-10px); }
  80% { transform: translateX(10px); }
}

.expired-icon svg {
  width: 50px;
  height: 50px;
}

.expired-title {
  font-size: var(--text-2xl);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-bottom: var(--space-s);
}

.expired-subtitle {
  font-size: var(--text-m);
  opacity: 0.7;
  max-width: 280px;
  margin-bottom: var(--space-xl);
  line-height: 1.6;
}

/* Reasons */
.reason-list {
  list-style: none;
  text-align: left;
  width: 100%;
  max-width: 300px;
  margin-bottom: var(--space-xl);
}

.reason-list li {
  display: flex;
  align-items: flex-start;
  gap: var(--space-s);
  padding: var(--space-s) 0;
  font-size: var(--text-s);
  opacity: 0.8;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.reason-list li:last-child {
  border-bottom: none;
}

.reason-list li svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}

/* Actions */
.actions {
  display: flex;
  flex-direction: column;
  gap: var(--space-s);
  width: 100%;
  max-width: 300px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  min-height: var(--tap-target-large);
  padding: var(--space-s);
  font-size: var(--text-s);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 2px solid var(--ground);
  text-decoration: none;
  transition: var(--transition-fast);
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--ground);
  color: var(--ink);
}

.btn-primary:active {
  background: transparent;
  color: var(--ground);
}

.btn-secondary {
  background: transparent;
  color: var(--ground);
}

.btn-secondary:active {
  background: var(--ground);
  color: var(--ink);
}

/* ═══════════════════════════════════════
   VARIANT: Payment Failed
   ═══════════════════════════════════════ */
.app.payment-failed .expired-icon {
  border-color: var(--danger);
}

.app.payment-failed .expired-title {
  color: var(--danger);
}
</style>
</head>
<body>
<div class="app">
  <div class="expired-icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
  </div>
  
  <h1 class="expired-title">Waktu Habis</h1>
  <p class="expired-subtitle">
    Sesi pemesanan kamu telah berakhir. Tiket yang kamu pilih dikembalikan ke antrian.
  </p>

  <ul class="reason-list">
    <li>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Tiket tidak dikenakan biaya</span>
    </li>
    <li>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>Kamu bisa mencoba lagi</span>
    </li>
    <li>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span>Ketersediaan tiket tidak dijamin</span>
    </li>
  </ul>

  <div class="actions">
    <a href="02-event-detail.html" class="btn btn-primary">Coba Lagi</a>
    <a href="01-home.html" class="btn btn-secondary">Kembali ke Home</a>
  </div>
</div>
</body>
</html>
