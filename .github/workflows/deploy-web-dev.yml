name: Release Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: Notes shown to Android testers (manual Firebase run only)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_context:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Check manual release branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          case "$GITHUB_REF_NAME" in
            develop|main) ;;
            *) echo 'Manual Firebase distribution must select develop or main.'; exit 1 ;;
          esac

  quality_gates:
    name: "Quality / ${{ matrix.check }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, format, coverage, runtime]
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        if: ${{ matrix.check == 'typecheck' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ matrix.check == 'lint' }}
        run: npm run lint
      - name: Format
        if: ${{ matrix.check == 'format' }}
        run: npm run format:check
      - name: Tests and coverage
        if: ${{ matrix.check == 'coverage' }}
        run: npm run test:coverage -- --runInBand --ci
      - name: Verify OTA fingerprint stability
        if: ${{ matrix.check == 'runtime' }}
        run: node scripts/verify-fingerprint.cjs
      - name: Upload Jest coverage for SonarCloud
        if: ${{ matrix.check == 'coverage' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/client/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  security_audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  sonarcloud:
    name: SonarCloud scan and quality gate
    needs: [quality_gates, security_audit]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sonar-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/client/coverage
      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_TOKEN" || {
            echo 'SONAR_TOKEN is missing from GitHub Actions secrets.'
            exit 1
          }
          test -n "$SONAR_ORGANIZATION" || {
            echo 'SONAR_ORGANIZATION is missing from GitHub Actions variables.'
            exit 1
          }
          test -n "$SONAR_PROJECT_KEY" || {
            echo 'SONAR_PROJECT_KEY is missing from GitHub Actions variables.'
            exit 1
          }
      - name: Run SonarCloud scan and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=apps/client/src
            -Dsonar.tests=apps/client/src/__tests__
            -Dsonar.exclusions=apps/client/src/__tests__/**
            -Dsonar.javascript.lcov.reportPaths=apps/client/coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  web_release:
    name: Build and deploy web
    if: ${{ github.event_name == 'push' }}
    needs: [quality_gates, security_audit, release_context]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: apps/client
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_USE_MOCKS: ${{ vars.EXPO_PUBLIC_USE_MOCKS }}
      EXPO_PUBLIC_ENV: ${{ vars.EXPO_PUBLIC_ENV }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - name: Validate branch environment
        run: |
          test -n "$EXPO_PUBLIC_API_BASE_URL" || {
            echo 'EXPO_PUBLIC_API_BASE_URL is required.'
            exit 1
          }
          test -n "$EXPO_PUBLIC_SITE_URL" || {
            echo 'EXPO_PUBLIC_SITE_URL is required.'
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is missing from this GitHub Environment.'
            exit 1
          }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || {
            echo 'CLOUDFLARE_PAGES_PROJECT is missing from this GitHub Environment.'
            exit 1
          }
          if [ "$GITHUB_REF_NAME" = 'develop' ]; then
            test "$EXPO_PUBLIC_ENV" = 'development' &&
              test "$EXPO_PUBLIC_USE_MOCKS" = 'false' || {
                echo 'develop must use the development BE with mocks disabled.'
                exit 1
              }
          elif [ "$GITHUB_REF_NAME" = 'main' ]; then
            test "$EXPO_PUBLIC_ENV" = 'production' &&
              test "$EXPO_PUBLIC_USE_MOCKS" = 'false' || {
                echo 'main must use production configuration with mocks disabled.'
                exit 1
              }
          else
            echo 'Only develop and main can deploy web releases.'
            exit 1
          fi
      - name: Export web application
        run: npx expo export --platform web
      - name: Generate web metadata
        run: npm run web:metadata
      - name: Generate verified app-link association files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] &&
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] &&
             [ -n "$ANDROID_KEY_ALIAS" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/app-link-signing.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            FINGERPRINT_HEX="$(keytool -exportcert \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 | awk '{print $NF}')"
            ANDROID_CERT_SHA256_FINGERPRINT="$(printf '%s' "$FINGERPRINT_HEX" | sed 's/../&:/g; s/:$//')"
            rm -f "$KEYSTORE_PATH"
          else
            echo '::warning::Android signing credentials are missing; verified app links will stay in the browser.'
            ANDROID_CERT_SHA256_FINGERPRINT=''
          fi
          ANDROID_CERT_SHA256_FINGERPRINT="$ANDROID_CERT_SHA256_FINGERPRINT" \
            node scripts/generate-link-associations.cjs
      - name: Verify exported web artifact
        run: npm run web:verify
      - name: Upload verified web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.ref_name }}-${{ github.run_id }}
          path: apps/client/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Deploy checked artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo 'CLOUDFLARE_API_TOKEN is missing from this GitHub Environment.'
            exit 1
          }
          npx --yes wrangler@4.158.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"

  publish_ota:
    name: Publish compatible EAS OTA
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref_name == 'develop' ||
          github.ref_name == 'main'
        )
      }}
    needs: [quality_gates, security_audit, release_context, web_release]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: apps/client
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_USE_MOCKS: ${{ vars.EXPO_PUBLIC_USE_MOCKS }}
      EXPO_PUBLIC_ENV: ${{ vars.EXPO_PUBLIC_ENV }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
      EXPO_PUBLIC_OTA_REVISION: ${{ github.run_number }}
      EAS_CHANNEL: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      OTA_ENABLED: ${{ (github.ref_name == 'main' && vars.EAS_OTA_PRODUCTION_ENABLED) || (github.ref_name == 'develop' && vars.EAS_OTA_DEVELOPMENT_ENABLED) || 'false' }}
    outputs:
      decision: ${{ steps.fingerprint.outputs.decision || steps.ota_gate.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check environment OTA toggle
        id: ota_gate
        run: |
          if [ "$OTA_ENABLED" = 'true' ]; then
            echo 'decision=enabled' >> "$GITHUB_OUTPUT"
            echo "EAS OTA is enabled for $GITHUB_REF_NAME."
          else
            echo 'decision=ota-disabled' >> "$GITHUB_OUTPUT"
            echo "EAS OTA is disabled for $GITHUB_REF_NAME; skipping publication."
          fi
      - uses: actions/setup-node@v4
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' }}
      - name: Detect native-affecting changes
        id: fingerprint
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$CHANGED_FILES"
          NATIVE_CHANGE=false
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq \
            '^(apps/client/(\.fingerprintignore|fingerprint\.config\.(js|cjs)|app\.json|eas\.json|package\.json|package-lock\.json|plugins/|android/|ios/|assets/|google-services\.json|GoogleService-Info\.plist)|.*\.(entitlements|podspec)$)'; then
            NATIVE_CHANGE=true
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -Fxq 'apps/client/app.config.js'; then
            if git diff --quiet -I '^[[:space:]]*slug:' \
              "$BEFORE_SHA" "$GITHUB_SHA" -- apps/client/app.config.js; then
              echo 'Expo slug-only project-link correction is OTA-compatible; it does not change the native runtime configuration.'
            else
              NATIVE_CHANGE=true
            fi
          fi

          if [ "$NATIVE_CHANGE" = 'true' ]; then
            echo 'decision=native-change-ota-skipped' >> "$GITHUB_OUTPUT"
            echo 'Native-affecting change detected. OTA is skipped; a new native APK/build is required.'
          else
            echo 'decision=ota-publish' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate EAS Update setup
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' && steps.fingerprint.outputs.decision == 'ota-publish' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          test -n "$EXPO_TOKEN" || {
            echo 'EXPO_TOKEN is missing from this GitHub Environment.'
            exit 1
          }
          test -n "$EXPO_PROJECT_ID" || {
            echo 'EXPO_PROJECT_ID is missing from this GitHub Environment.'
            exit 1
          }
          node -e "
            const pkg = require('./package.json');
            if (!pkg.dependencies?.['expo-updates']) {
              throw new Error('EAS OTA is enabled, but expo-updates is not installed. Complete Expo Update setup first.');
            }
          "
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          node -e "
            const fs = require('node:fs');
            const config = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            if (!config.runtimeVersion || !config.updates?.url || !config.extra?.eas?.projectId) {
              throw new Error('EAS OTA is enabled, but runtimeVersion, updates.url, or extra.eas.projectId is missing.');
            }
            if (config.extra.eas.projectId !== process.env.EXPO_PROJECT_ID) {
              throw new Error('EXPO_PROJECT_ID does not match extra.eas.projectId in Expo config.');
            }
          " "$RUNNER_TEMP/expo-config.json"
      - name: Publish OTA to the branch channel
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' && steps.fingerprint.outputs.decision == 'ota-publish' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx --yes eas-cli@27.5.0 update \
            --channel "$EAS_CHANNEL" \
            --message "${UPDATE_MESSAGE:-Release ${GITHUB_SHA::7}}" \
            --non-interactive

  firebase_distribution:
    name: Manual Firebase Android distribution
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [quality_gates, security_audit, release_context]
    uses: ./.github/workflows/distribute-android-qa.yml
    with:
      target_environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit

  notify:
    name: Notify Telegram
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      [
        quality_gates,
        security_audit,
        release_context,
        web_release,
        publish_ota,
        firebase_distribution,
      ]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Send release results and failed job names
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          OTA_JOB_RESULT: ${{ needs.publish_ota.result }}
          OTA_DECISION: ${{ needs.publish_ota.outputs.decision || needs.publish_ota.result }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || {
            echo 'Telegram credentials are missing from this GitHub Environment.'
            exit 1
          }
          RESULTS=$(printf '%s' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"')
          FAILED_JOBS=$(printf '%s' "$JOB_RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          case "$OTA_DECISION" in
            native-change-ota-skipped)
              OTA_STATUS='SKIPPED — native changes require a new APK build'
              ;;
            ota-disabled)
              OTA_STATUS='SKIPPED — EAS OTA is disabled for this environment'
              ;;
            ota-publish)
              if [ "$OTA_JOB_RESULT" = 'success' ]; then
                OTA_STATUS='PUBLISHED'
              else
                OTA_STATUS="NOT PUBLISHED — OTA job $OTA_JOB_RESULT"
              fi
              ;;
            skipped)
              OTA_STATUS='NOT RUN — manual Firebase distribution'
              ;;
            *)
              OTA_STATUS="$OTA_DECISION"
              ;;
          esac
          if [ -n "$FAILED_JOBS" ]; then
            STATUS="FAILED — $FAILED_JOBS"
          elif [ "$OTA_DECISION" = 'native-change-ota-skipped' ]; then
            STATUS='NATIVE BUILD REQUIRED'
          elif [ "$OTA_DECISION" = 'ota-disabled' ]; then
            STATUS='PARTIAL RELEASE — OTA DISABLED'
          else
            STATUS="SUCCESS"
          fi
          MESSAGE=$(printf 'Release Pipeline: %s\nBranch: %s\nCommit: %s\nOTA: %s\n\n%s\n\n%s/%s/actions/runs/%s' \
            "$STATUS" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$OTA_STATUS" "$RESULTS" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MESSAGE" > /dev/null
