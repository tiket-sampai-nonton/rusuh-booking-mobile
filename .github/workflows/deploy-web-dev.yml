name: Release Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: Notes shown to Android testers (manual Firebase run only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality_gates:
    name: Shared quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - name: Validate manual release branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          case "$GITHUB_REF_NAME" in
            develop|main) ;;
            *)
              echo 'Manual Firebase distribution must select develop or main.'
              exit 1
              ;;
          esac
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage -- --runInBand --ci
      - run: npm audit --omit=dev --audit-level=high
      # SonarCloud remains temporarily skipped by project decision.

  web_release:
    name: Build and deploy web
    if: ${{ github.event_name == 'push' }}
    needs: quality_gates
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: apps/client
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_USE_MOCKS: ${{ vars.EXPO_PUBLIC_USE_MOCKS }}
      EXPO_PUBLIC_ENV: ${{ vars.EXPO_PUBLIC_ENV }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - name: Validate branch environment
        run: |
          test -n "$EXPO_PUBLIC_API_BASE_URL" || {
            echo 'EXPO_PUBLIC_API_BASE_URL is required.'
            exit 1
          }
          test -n "$EXPO_PUBLIC_SITE_URL" || {
            echo 'EXPO_PUBLIC_SITE_URL is required.'
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo 'CLOUDFLARE_ACCOUNT_ID is missing from this GitHub Environment.'
            exit 1
          }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || {
            echo 'CLOUDFLARE_PAGES_PROJECT is missing from this GitHub Environment.'
            exit 1
          }
          if [ "$GITHUB_REF_NAME" = 'develop' ]; then
            test "$EXPO_PUBLIC_ENV" = 'development' &&
              test "$EXPO_PUBLIC_USE_MOCKS" = 'true' || {
                echo 'develop must use development configuration with mocks enabled.'
                exit 1
              }
          elif [ "$GITHUB_REF_NAME" = 'main' ]; then
            test "$EXPO_PUBLIC_ENV" = 'production' &&
              test "$EXPO_PUBLIC_USE_MOCKS" = 'false' || {
                echo 'main must use production configuration with mocks disabled.'
                exit 1
              }
          else
            echo 'Only develop and main can deploy web releases.'
            exit 1
          fi
      - run: npx expo export --platform web
      - run: npm run web:metadata
      - run: npm run web:verify
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.ref_name }}-${{ github.run_id }}
          path: apps/client/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Deploy checked artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo 'CLOUDFLARE_API_TOKEN is missing from this GitHub Environment.'
            exit 1
          }
          npx --yes wrangler@4.158.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"

  publish_ota:
    name: Publish compatible EAS OTA
    if: >-
      ${{
        github.event_name == 'push' &&
        (
          github.ref_name == 'develop' ||
          github.ref_name == 'main'
        )
      }}
    needs: [quality_gates, web_release]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    defaults:
      run:
        working-directory: apps/client
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EAS_CHANNEL: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      EAS_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      OTA_ENABLED: ${{ (github.ref_name == 'main' && vars.EAS_OTA_PRODUCTION_ENABLED) || (github.ref_name == 'develop' && vars.EAS_OTA_DEVELOPMENT_ENABLED) || 'false' }}
    outputs:
      decision: ${{ steps.fingerprint.outputs.decision || steps.ota_gate.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check environment OTA toggle
        id: ota_gate
        run: |
          if [ "$OTA_ENABLED" = 'true' ]; then
            echo 'decision=enabled' >> "$GITHUB_OUTPUT"
            echo "EAS OTA is enabled for $GITHUB_REF_NAME."
          else
            echo 'decision=ota-disabled' >> "$GITHUB_OUTPUT"
            echo "EAS OTA is disabled for $GITHUB_REF_NAME; skipping publication."
          fi
      - uses: actions/setup-node@v4
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' }}
      - name: Detect native-affecting changes
        id: fingerprint
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            BEFORE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$CHANGED_FILES"
          if printf '%s\n' "$CHANGED_FILES" | grep -Eq \
            '^(apps/client/(app\.config\.js|app\.json|eas\.json|package\.json|package-lock\.json|plugins/|android/|ios/|assets/|google-services\.json|GoogleService-Info\.plist)|.*\.(entitlements|podspec)$)'; then
            echo 'decision=native-change-ota-skipped' >> "$GITHUB_OUTPUT"
            echo 'Native-affecting change detected. OTA is skipped; a new native APK/build is required.'
          else
            echo 'decision=ota-publish' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate EAS Update setup
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' && steps.fingerprint.outputs.decision == 'ota-publish' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          test -n "$EXPO_TOKEN" || {
            echo 'EXPO_TOKEN is missing from this GitHub Environment.'
            exit 1
          }
          test -n "$EXPO_PROJECT_ID" || {
            echo 'EXPO_PROJECT_ID is missing from this GitHub Environment.'
            exit 1
          }
          node -e "
            const pkg = require('./package.json');
            if (!pkg.dependencies?.['expo-updates']) {
              throw new Error('EAS OTA is enabled, but expo-updates is not installed. Complete Expo Update setup first.');
            }
          "
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          node -e "
            const fs = require('node:fs');
            const config = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            if (!config.runtimeVersion || !config.updates?.url || !config.extra?.eas?.projectId) {
              throw new Error('EAS OTA is enabled, but runtimeVersion, updates.url, or extra.eas.projectId is missing.');
            }
            if (config.extra.eas.projectId !== process.env.EXPO_PROJECT_ID) {
              throw new Error('EXPO_PROJECT_ID does not match extra.eas.projectId in Expo config.');
            }
          " "$RUNNER_TEMP/expo-config.json"
      - name: Publish OTA to the branch channel
        if: ${{ steps.ota_gate.outputs.decision == 'enabled' && steps.fingerprint.outputs.decision == 'ota-publish' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          npx --yes eas-cli@27.5.0 update \
            --channel "$EAS_CHANNEL" \
            --environment "$EAS_ENVIRONMENT" \
            --message "${UPDATE_MESSAGE:-Release ${GITHUB_SHA::7}}" \
            --non-interactive

  firebase_distribution:
    name: Manual Firebase Android distribution
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: quality_gates
    uses: ./.github/workflows/distribute-android-qa.yml
    with:
      target_environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      release_notes: ${{ inputs.release_notes }}
    secrets: inherit

  notify:
    name: Notify Telegram
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [quality_gates, web_release, publish_ota, firebase_distribution]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Send release results and failed job names
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          OTA_DECISION: ${{ needs.publish_ota.outputs.decision || needs.publish_ota.result }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || {
            echo 'Telegram credentials are missing from this GitHub Environment.'
            exit 1
          }
          RESULTS=$(printf '%s' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"')
          FAILED_JOBS=$(printf '%s' "$JOB_RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$FAILED_JOBS" ]; then
            STATUS="FAILED — $FAILED_JOBS"
          elif [ "$GITHUB_EVENT_NAME" = 'push' ] && \
            [ "$OTA_DECISION" = 'native-change-ota-skipped' ]; then
            STATUS='PARTIAL — native build required; OTA skipped'
          elif [ "$GITHUB_EVENT_NAME" = 'push' ] && \
            [ "$OTA_DECISION" = 'ota-disabled' ]; then
            STATUS='PARTIAL — EAS OTA is not enabled'
          else
            STATUS="SUCCESS"
          fi
          MESSAGE=$(printf 'Release Pipeline: %s\nBranch: %s\nCommit: %s\nOTA: %s\n\n%s\n\n%s/%s/actions/runs/%s' \
            "$STATUS" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$OTA_DECISION" "$RESULTS" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$MESSAGE" > /dev/null
