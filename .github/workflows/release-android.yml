name: release-android

# Build APK Android lalu publikasikan ke GitHub Releases saat tag v* di-push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      EXPO_PUBLIC_WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install
      - run: pnpm test
      - run: pnpm prebuild:android
      # Catatan: template release React Native menandatangani dengan debug keystore (cukup untuk APK demo).
      # Untuk keystore sendiri, tambahkan signingConfig dan secrets ANDROID_KEYSTORE_* lalu ubah langkah ini.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rusuh-booking-${{ github.ref_name }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
